[project]
name = "repobrief"
version = "0.2.0"
description = "Understand any GitHub repo in seconds: metadata, README and recent commits, summarised by a free OpenRouter model or as a facts-only brief."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repobrief = "repobrief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
